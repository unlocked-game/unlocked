<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UNLOCKED</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    const map = L.map('map').setView([52.6083, 1.7305], 13);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);
    // UNLOCKED - FOG OF WAR
// ===============================

// ===============================
// UNLOCKED - FOG OF WAR
// ===============================


let lastExploredLat = null;
let lastExploredLng = null;

const revealRadius = 50; // metres
const revealSpacing = 10; // only record movement every 10 metres
let exploredAreas = JSON.parse(localStorage.getItem('unlockedExploredAreas') || '[]');

// Create the fog canvas
const fogCanvas = document.createElement('canvas');

fogCanvas.style.position = 'absolute';
fogCanvas.style.top = '0';
fogCanvas.style.left = '0';
fogCanvas.style.width = '100%';
fogCanvas.style.height = '100%';
fogCanvas.style.pointerEvents = 'none';
fogCanvas.style.zIndex = '400';

map.getContainer().appendChild(fogCanvas);

const fogContext = fogCanvas.getContext('2d');

function resizeFogCanvas() {

    const size = map.getSize();

    fogCanvas.width = size.x;
    fogCanvas.height = size.y;

    drawFog();
}

function distanceMetres(lat1, lng1, lat2, lng2) {

    const R = 6371000;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

function drawFog() {

    const size = map.getSize();

    fogContext.clearRect(
        0,
        0,
        size.x,
        size.y
    );

    // Dark fog
    fogContext.fillStyle = 'rgba(17, 17, 17, 0.93)';

    fogContext.fillRect(
        0,
        0,
        size.x,
        size.y
    );

    // Cut out explored areas
    fogContext.globalCompositeOperation = 'destination-out';

    exploredAreas.forEach(function (area) {

        const point = map.latLngToContainerPoint([
            area.lat,
            area.lng
        ]);

        const metresPerPixel =
    map.distance(
        map.containerPointToLatLng([point.x, point.y]),
        map.containerPointToLatLng([point.x + 1, point.y])
    );

const radiusPixels = revealRadius / metresPerPixel;

        fogContext.beginPath();

        fogContext.arc(
            point.x,
            point.y,
            radiusPixels,
            0,
            Math.PI * 2
        );

        fogContext.fill();
    });

    fogContext.globalCompositeOperation = 'source-over';
}

function revealLocation(lat, lng) {

    if (
        lastExploredLat !== null &&
        distanceMetres(
            lastExploredLat,
            lastExploredLng,
            lat,
            lng
        ) < revealSpacing
    ) {
        return;
    }

    exploredAreas.push({
        lat: lat,
        lng: lng
    });

    // Save explored locations to the phone
    localStorage.setItem(
        'unlockedExploredAreas',
        JSON.stringify(exploredAreas)
    );

    lastExploredLat = lat;
    lastExploredLng = lng;

    drawFog();
}

// Resize when map changes
map.on('resize', resizeFogCanvas);
map.on('move', drawFog);
map.on('zoom', drawFog);

// Initial canvas setup
resizeFogCanvas();

    // Ask the device for its location
   map.locate({
    setView: true,
    maxZoom: 18,
    enableHighAccuracy: true,
    watch: true
});

    

let playerMarker = null;

map.on('locationfound', function (e) {

    if (playerMarker === null) {
        playerMarker = L.marker(e.latlng)
            .addTo(map)
            .bindPopup('📍 You are here!');
    } else {
        playerMarker.setLatLng(e.latlng);
    }

    revealLocation(e.latlng.lat, e.latlng.lng);
    console.log('Your location:', e.latlng);
});
// Location failed
map.on('locationerror', function (e) {
    alert('We could not get your location. Please allow location access.');
});
</script>

</body>
</html>
